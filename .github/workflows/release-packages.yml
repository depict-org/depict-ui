name: Release browser-tags-v2 packages

# Publishes the eight browser-tags-v2 packages with the repo's own release
# script (devtools/publish_packages.sh): it bumps each package one patch,
# builds it and runs `yarn npm publish`. The version bumps it leaves are then
# committed to release/<tag> and proposed to main as a pull request.
#
# A release from a release-v* tag that published fully also gets GitHub
# Releases, so Dependabot can show merchants what changed in its bump PRs:
# one per package, tagged "<npm name>@<version>" (Dependabot only picks a
# monorepo package's releases by that prefix, and the packages' versions
# differ), plus a release-v* summary. The notes come from the commit subjects
# since the previous release (.github/scripts/release-notes.sh).
#
# The npm credential is the NPM_PUBLISH_TOKEN repository secret and reaches
# yarn only as YARN_NPM_AUTH_TOKEN (yarn berry's env form of npmAuthToken). It
# is never written to disk or printed.
#
# Note: packages/performance-client publishes as @depict-ai/dpc.

on:
  push:
    tags:
      - "release-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag to publish under"
        type: choice
        options:
          - dev
          - latest
        # dev, so an accidental dispatch cannot ship a stable release; latest
        # goes out from a release-v* tag or a deliberate choice here.
        default: dev

permissions:
  contents: write
  pull-requests: write
  # For the later swap to npm Trusted Publishing (OIDC).
  id-token: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release:
    runs-on: depot-ubuntu-24.04-4
    defaults:
      run:
        working-directory: browser-tags-v2
    env:
      DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: browser-tags-v2/yarn.lock

      - name: Install dependencies
        id: install
        run: yarn install --immutable

      # Guard: fail before anything is bumped if the token does not
      # authenticate against the publish registry (.yarnrc.yml
      # npmPublishRegistry, https://registry.npmjs.org).
      - name: Check the npm credential
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: yarn npm whoami --publish

      - name: Bump, build and publish
        id: publish
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: yarn "publish-packages-${DIST_TAG}"

      # Only for a release-v* tag that published fully: a dispatch has no tag to
      # attach releases to, and a partial publish needs a person first. Its
      # changes are then picked up by the next tag's notes (see "previous").
      - name: Create the GitHub Releases
        if: ${{ github.event_name == 'push' && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha=$(git rev-parse "${tag}^{commit}")

          # 0 = the release exists, 1 = it doesn't. Any other error (auth,
          # network, rate limit) stops the step instead of reading as "missing".
          release_exists() {
            local out
            if out=$(gh release view "$1" --json tagName 2>&1); then
              return 0
            fi
            if [ "${out}" = "release not found" ]; then
              return 1
            fi
            echo "::error::Couldn't check the GitHub Release $1: ${out}"
            exit 1
          }

          # Notes start at the newest release-v* tag below this one that got a
          # GitHub Release, so a partial publish in between (no Release) doesn't
          # leave its changes out. Falls back to the newest lower tag.
          previous=""
          fallback=""
          while IFS= read -r candidate; do
            [ "${candidate}" != "${tag}" ] || continue
            lowest=$(printf '%s\n%s\n' "${candidate}" "${tag}" | sort -V | head -n 1)
            [ "${lowest}" = "${candidate}" ] || continue # above this tag
            [ -n "${fallback}" ] || fallback="${candidate}"
            if release_exists "${candidate}"; then
              previous="${candidate}"
              break
            fi
          done < <(git tag --list 'release-v*' --sort=-v:refname)
          previous="${previous:-${fallback}}"

          changes=$(mktemp)
          if [ -n "${previous}" ]; then
            "${GITHUB_WORKSPACE}/.github/scripts/release-notes.sh" "${previous}" "${tag}" > "${changes}"
            echo "Notes cover ${previous}..${tag}"
          else
            printf 'First release with release notes.\n\n' > "${changes}"
          fi
          tag_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"

          # One release per published package, at the commit the tag points to
          versions=""
          for p in packages/*/package.json; do
            read -r name version private < <(node -p "const j=require('./$p'); [j.name, j.version, Boolean(j.private)].join(' ')")
            [ "${private}" = "false" ] || continue
            versions+="- \`${name}\` ${version}"$'\n'
            package_tag="${name}@${version}"
            if release_exists "${package_tag}"; then
              echo "GitHub Release ${package_tag} already exists."
              continue
            fi
            notes=$(mktemp)
            {
              printf '`%s` %s, published with [%s](%s).\n\n' "${name}" "${version}" "${tag}" "${tag_url}"
              cat "${changes}"
            } > "${notes}"
            gh release create "${package_tag}" --target "${sha}" --title "${package_tag}" --notes-file "${notes}" --latest=false
          done

          # The summary release, last so it is the repo's latest release
          if release_exists "${tag}"; then
            echo "GitHub Release ${tag} already exists."
          else
            notes=$(mktemp)
            {
              printf 'Published to npm under the `latest` dist-tag:\n\n%s\n' "${versions}"
              cat "${changes}"
            } > "${notes}"
            gh release create "${tag}" --verify-tag --title "${tag}" --notes-file "${notes}" --latest
          fi

      # Runs after a partial failure too: a package already published must
      # have its version bump recorded, or the next release collides with it.
      - name: Propose the version bumps to main
        if: ${{ !cancelled() && (steps.publish.outcome == 'success' || steps.publish.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          if git diff --quiet :/; then
            echo "No version bumps to commit."
            exit 0
          fi
          # Only version bumps may be proposed: the package.json version lines
          # `yarn version` writes, and the src/version.ts the builds stamp from
          # them (scripts/pre_build.cjs). `yarn version` leaves yarn.lock
          # untouched, so a lockfile change is unexpected too. A build that died
          # mid-way can leave a package.json rewritten (pre_build.cjs also strips
          # its entry points), and that must reach a person, not main.
          unexpected=$(git diff --name-only :/ | grep -vE '^browser-tags-v2/packages/[^/]+/(package\.json|src/version\.ts)$' || true)
          non_version=$(git diff -U0 -- 'packages/*/package.json' | grep -E '^[+-][^+-]' | grep -vE '^[+-][[:space:]]*"version":[[:space:]]*"[^"]*",?$' || true)
          non_version_ts=$(git diff -U0 -- 'packages/*/src/version.ts' | grep -E '^[+-][^+-]' | grep -vE '^[+-]export const version = "[^"]*";$' || true)
          if [ -n "${unexpected}${non_version}${non_version_ts}" ]; then
            echo "::error::The working tree holds changes other than version bumps; not proposing them."
            printf '%s\n' "${unexpected}" "${non_version}" "${non_version_ts}"
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            label="${GITHUB_REF_NAME}"
          else
            label="dispatch-${DIST_TAG}-${GITHUB_RUN_ID}"
          fi
          branch="release/${label}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add -- 'packages/*/package.json' 'packages/*/src/version.ts'
          git commit -m "chore(release): ${label} (${DIST_TAG})"
          # The branch is the bot's own: a re-run for the same tag replaces it,
          # and updates the open pull request rather than opening a second one.
          git push --force origin "${branch}"
          versions=$(for p in packages/*/package.json; do node -p "const j=require('./$p'); j.name + ' ' + j.version"; done)
          fence='```'
          body=$(printf 'Version bumps left by the release workflow run %s/%s/actions/runs/%s (dist-tag %s, publish step: %s).\n\n%s\n%s\n%s\n' \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${DIST_TAG}" "${PUBLISH_OUTCOME}" "${fence}" "${versions}" "${fence}")
          if gh pr view "${branch}" --json state -q .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "${branch}" --body "${body}"
          else
            gh pr create --base main --head "${branch}" --title "chore(release): ${label}" --body "${body}"
          fi
