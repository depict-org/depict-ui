name: Preview Browser

on:
  push:
    branches:
      - main
    paths:
      - preview_browser/**
      - .github/workflows/preview-browser-deploy.yml
  pull_request:
    paths:
      - preview_browser/**
      - .github/workflows/preview-browser-deploy.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview_browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the node major the app was containerised with; corepack picks the
          # yarn version from package.json's packageManager field.
          node-version: 21
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - name: Snapshot the SPA shell into the static output
        # @solidjs/start 0.4.x with ssr:false renders the SPA shell at runtime
        # instead of emitting index.html — boot the built server once, save its
        # shell, and assert the result is a real self-contained SPA entrypoint
        # (script tags present, no baked-in localhost URLs). This is what makes
        # .output/public deployable as a static assets directory.
        # `yarn start`, not `node .output/server/index.mjs`: the repo uses yarn PnP,
        # and the built server still resolves some deps (vinxi/pathe) through it.
        run: |
          PORT=3000 yarn start &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            curl -fs http://localhost:3000/ -o .output/public/index.html && break
            sleep 1
          done
          kill "$SERVER_PID" || true
          test -s .output/public/index.html
          grep -q "<script" .output/public/index.html
          ! grep -q "localhost" .output/public/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: preview-browser-dist
          path: preview_browser/.output/public
          retention-days: 7

  deploy:
    # Deploy only from main. Requires the CLOUDFLARE_API_TOKEN repo secret
    # (Workers Scripts:Edit on the depict account) — NOT configured yet; until it is,
    # this job fails at the wrangler step and that is expected.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preview-browser-dist
          path: preview_browser/.output/public
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: preview_browser
